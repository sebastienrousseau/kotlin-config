build:
  maxIssues: 0
  weights:
    complexity: 2
    formatting: 1

complexity:
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 12

formatting:
  active: true
  android: false
  autoCorrect: true
